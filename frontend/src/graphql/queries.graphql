# graphql/queries.graphql

query GetMe {
    me {
        name
        clubId
        clubName
        roles
    }
}

query GetTournaments {
    tournaments {
        id
        name
        season
        dates {
            id
            date
        }
        divisions {
            id
            name
            teams {
                id
                team {
                    id
                    name
                }
            }
        }
        teams {
            id
            team {
                id
                name
            }
            division {
                id
                name
            }
        }
        matches {
            id
            home_team_score
            away_team_score
            match_date
        }
    }
}

query GetClubs($includeInactive: Boolean = false) {
    clubs(includeInactive: $includeInactive) {
        id
        name
        isActive
        region
        address
        contact_info
        website
    }
}

query GetClubsWithTeams($includeInactive: Boolean = false) {
    clubs(includeInactive: $includeInactive) {
        id
        name
        isActive
        region
        teams(includeInactive: $includeInactive) {
            id
            name
            isActive
        }
    }
}

query GetClub($id: ID!, $includeInactive: Boolean = false) {
    club(id: $id, includeInactive: $includeInactive) {
        id
        name
        isActive
        region
        address
        contact_info
        website
        teams(includeInactive: $includeInactive) {
            id
            name
            isActive
        }
    }
}

query GetClubMembers($id: ID!, $includeInactive: Boolean = false) {
    club(id: $id, includeInactive: $includeInactive) {
        id
        members {
            id
            name
            email
        }
    }
}

query GetTeamForEdit($id: ID!, $includeInactive: Boolean = false) {
    team(id: $id, includeInactive: $includeInactive) {
        id
        name
        isActive
        club {
            id
            name
            isActive
            members {
                id
                name
                email
            }
        }
        members {
            id
            name
            email
        }
    }
}

query GetUsers {
    users {
        id
        name
        email
    }
}

query GetFines($clubId: ID, $includePaid: Boolean) {
    fines(club_id: $clubId, includePaid: $includePaid) {
        id
        club_id
        reason
        amount
        date
        paid
        club {
            id
            name
        }
    }
}

mutation CreateFine($fine: CreateFineInput!) {
    createFine(fine: $fine) {
        id
        club_id
        reason
        amount
        date
        paid
        club { id name }
    }
}

mutation UpdateFine($fine: UpdateFineInput!) {
    updateFine(fine: $fine) {
        id
        club_id
        reason
        amount
        date
        paid
        club { id name }
    }
}

mutation CreateClub($name: String!, $address: String!, $region: String!) {
    createClub(name: $name, address: $address, region: $region) {
        id
        name
        region
        address
    }
}

mutation UpdateClub($id: Int!, $name: String, $address: String, $region: String) {
    updateClub(id: $id, name: $name, address: $address, region: $region) {
        id
        name
        region
        address
    }
}

mutation SetClubActive($id: Int!, $isActive: Boolean!) {
    setClubActive(id: $id, isActive: $isActive) {
        id
        isActive
    }
}

mutation CreateTeam($name: String!, $clubId: Int!, $memberIds: [Int!]!) {
    createTeam(name: $name, clubId: $clubId, memberIds: $memberIds) {
        id
        name
    }
}

mutation UpdateTeam($id: Int!, $name: String, $memberIds: [Int!]) {
    updateTeam(id: $id, name: $name, memberIds: $memberIds) {
        id
        name
    }
}

mutation SetTeamActive($id: Int!, $isActive: Boolean!) {
    setTeamActive(id: $id, isActive: $isActive) {
        id
        isActive
    }
}


mutation CreateTournament($input: CreateTournamentInput!) {
    createTournament(input: $input) {
        id
        name
        season
        divisions {
            id
            name
        }
        dates {
            id
            date
        }
        teams {
            id
            team {
                id
                name
            }
            division {
                id
                name
            }
        }
    }
}

mutation UpdateTournament(
    $id: Int!
    $input: UpdateTournamentInput!
) {
    updateTournament(id: $id, input: $input) {
        id
        name
        season
        divisions {
            id
            name
            teams {
                team {
                    id
                    name
                }
            }
        }
        dates {
            id
            date
        }
    }
}

query GetTournamentsForSelector {
    tournaments {
        id
        name
        season
    }
}

query GetTournamentMatches($tournamentId: ID!) {
    tournament(id: $tournamentId) {
        id
        name
        dates {
            id
            date
        }
        season
        teams {
            id
            team {
                id
                name
            }
            division {
                id
                name
            }
        }
        matches {
            id
            field
            home_team_score
            away_team_score
            match_date
            home_team {
                id
                name
            }
            away_team {
                id
                name
            }
            winner_team {
                id
                name
            }
            division {
                id
                name
            }
        }
    }
}

mutation GenerateTournamentPlan($tournamentId: Int!, $fields: Int!, $startTime: Int!) {
    generateTournamentPlan(tournamentId: $tournamentId, fields: $fields, startTime: $startTime) {
        id
        field
        match_date
        home_team { id name }
        away_team { id name }
        division { id name }
    }
}

mutation CreateTournamentDate($tournamentId: Int!, $date: String!) {
    createTournamentDate(tournamentId: $tournamentId, date: $date) {
        id
        date
        tournament {
            id
        }
    }
}

mutation DeleteTournamentDate($id: Int!) {
    deleteTournamentDate(id: $id) {
        id
        tournament {
            id
        }
    }
}

