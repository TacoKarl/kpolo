name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'rapport/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'rapport/**'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  # Detect which paths have changed
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      rapport: ${{ steps.filter.outputs.rapport }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            rapport:
              - 'rapport/**'

  # Run only if frontend files changed
  frontend:
    name: frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "frontend"

  # Run only if backend files changed
  backend:
    name: backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "backend"

  # Run only if rapport files changed
  rapport:
    name: rapport
    needs: changes
    if: ${{ needs.changes.outputs.rapport == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended biber make
      - name: Compile LaTeX
        working-directory: rapport/latex-rapport
        run: |
          pdflatex -interaction=nonstopmode main.tex
          biber main
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-PDF
          path: rapport/latex-rapport/main.pdf
          retention-days: 30
