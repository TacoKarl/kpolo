name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'rapport/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'rapport/**'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  # Detect which paths have changed
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      rapport: ${{ steps.filter.outputs.rapport }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            rapport:
              - 'rapport/**'

  # Run only if frontend files changed
  frontend:
    name: frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    environment: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "frontend"

  # Run only if backend files changed
  backend:
    name: backend check
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    environment: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Create .env file
        run: |
          cat <<EOF > backend/.env
          NODE_ENV=development
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          PORT=3000
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PGADMIN_DEFAULT_EMAIL=${{ secrets.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD=${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          EOF

      - name: Start backend via docker
        run: docker-compose -f backend/compose.yaml up -d

      #- name: Wait for API
      #  run: |
      #    for i in {1..10}; do
      #      curl --fail http://localhost:3000/health && exit 0
      #      sleep 2
      #    done
      #    echo "API did not become healthy in time"
      #    exit 1

      - name: Run Bruno tests
        working-directory: bruno-apitests/local
        run: bru run .

      - name: Stop backend
        run: docker-compose -f backend/compose.yaml down

  # Run only if rapport files changed
  rapport:
    name: rapport
    needs: changes
    if: ${{ needs.changes.outputs.rapport == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended biber make
      - name: Compile LaTeX
        working-directory: rapport/latex-rapport
        run: |
          pdflatex -interaction=nonstopmode main.tex
          biber main
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-PDF
          path: rapport/latex-rapport/main.pdf
          retention-days: 30