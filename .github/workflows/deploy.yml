name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  changes:
    name: Check for backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          # Check if any files in kpolo/backend changed in this push
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^backend/'; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/appuser/kpolo
          git fetch origin main
          git reset --hard origin/main

      - name: Build and start container
        run: |
          cd /home/appuser/kpolo/backend
          podman compose up --build api -d

      - name: Wait for
        run: |
          for i in {1..10}; do
          curl --fail http://localhost:3000/health && exit 0
          sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Run Prisma migrations
        run: |
          podman exec api npx prisma migrate deploy

      - name: Seed database
        run: |
          podman exec api npx prisma db seed || echo "Seeding failed, continuing..."